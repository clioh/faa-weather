<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="50%" style="stop-color:#252530"/>
      <stop offset="100%" style="stop-color:#15151f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb300;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Mirror frame -->
  <rect x="4" y="2" width="24" height="28" rx="2" fill="url(#glass)" stroke="#ffb300" stroke-width="1"/>
  <!-- Reflection line -->
  <line x1="6" y1="4" x2="10" y2="4" stroke="#ffb300" stroke-width="0.5" opacity="0.6"/>
  <!-- Weather indicator -->
  <circle cx="24" cy="6" r="2" fill="#00c853"/>
  <!-- Time display -->
  <text x="8" y="12" font-family="monospace" font-size="4" fill="#ffb300">08:42</text>
  <text x="8" y="16" font-family="monospace" font-size="2.5" fill="#6b6b80">ZULU</text>
  <!-- Airport code -->
  <text x="8" y="24" font-family="monospace" font-size="3" fill="#e8e8ec">KJFK</text>
</svg>
