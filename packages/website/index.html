<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SkyGlass | Smart Mirror for Pilots - Aviation Weather & Flight Schedules</title>
    <meta name="title" content="SkyGlass | Smart Mirror for Pilots - Aviation Weather & Flight Schedules" />
    <meta name="description" content="SkyGlass is a smart mirror that displays live METAR, TFRs, NOTAMs, and your flight schedule. Looks like a regular mirror until you walk up. Built by a pilot, for pilots." />
    <meta name="keywords" content="smart mirror, aviation weather, METAR, pilot, flight schedule, TFR, NOTAM, Raspberry Pi, aviation display, flight deck" />
    <meta name="author" content="SkyGlass" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkyGlass" />
    <meta property="og:title" content="SkyGlass | Smart Mirror for Pilots" />
    <meta property="og:description" content="A smart mirror that displays live METAR, TFRs, and your flight schedule. Looks like a regular mirror until you walk up. Built by a pilot, for pilots." />
    <meta property="og:image" content="https://skyglass.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkyGlass | Smart Mirror for Pilots" />
    <meta name="twitter:description" content="A smart mirror that displays live METAR, TFRs, and your flight schedule. Looks like a regular mirror until you walk up." />
    <meta name="twitter:image" content="https://skyglass.dev/og-image.png" />
    <meta name="twitter:site" content="@skyglassdev" />
    <meta name="twitter:creator" content="@skyglassdev" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SkyGlass",
      "url": "https://skyglass.dev",
      "logo": "https://skyglass.dev/logo.png",
      "description": "Smart mirror displays for pilots featuring aviation weather, TFRs, NOTAMs, and flight schedules.",
      "sameAs": [
        "https://twitter.com/skyglassdev"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@skyglass.dev",
        "contactType": "customer support"
      }
    }
    </script>

    <!--
      Per-page tags (canonical, og:url, twitter:url, robots) come from src/components/SEO.tsx.
      Product and FAQPage structured data are rendered on the home page (src/pages/Home.tsx,
      src/components/FAQ.tsx) so they follow the store mode and the visible FAQ.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
