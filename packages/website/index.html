    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What exactly is SkyGlass?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SkyGlass is a smart mirror that looks like a regular mirror when idle. When you walk up to it, it detects your presence and displays aviation weather (METAR/TAF), TFRs, NOTAMs, your flight schedule, and more. Step away, and it returns to being just a mirror."
          }
        },
        {
          "@type": "Question",
          "name": "Where does the weather data come from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Weather data comes from the Aviation Weather Center (aviationweather.gov), the official source for US aviation weather. Data refreshes automatically and is typically less than 5 minutes old."
          }
        },
        {
          "@type": "Question",
          "name": "How does the face recognition work? Is it private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Face recognition runs entirely on-device using the Raspberry Pi. Your face embeddings are stored locally and never leave your home—not to our servers, not to any cloud. You can delete your data anytime through the companion app."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use this for flight planning?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. SkyGlass is for awareness and convenience only—it's not a replacement for proper flight planning. Always use official sources like 1800wxbrief.com or ForeFlight for actual flight planning and pre-flight briefings."
          }
        },
        {
          "@type": "Question",
          "name": "How hard is it to set up?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Complete Kit takes about 30 minutes to assemble—just mount the mirror, connect the Pi, and run through the app setup. The Hardware Kit requires sourcing your own mirror and frame but includes detailed instructions. Software-only is for experienced DIYers."
          }
        },
        {
          "@type": "Question",
          "name": "Can multiple people use it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. SkyGlass supports multiple face profiles, each with their own home airports, calendar connections, and widget preferences. It automatically shows the right dashboard when it recognizes you."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work without internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basic features like time, date, and cached weather work offline. Live weather updates, TFRs, and calendar sync require an internet connection. The mirror itself will always function."
          }
        }
      ]
    }
    </script>
