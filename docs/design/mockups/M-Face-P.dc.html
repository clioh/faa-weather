<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mirror — face registration (portrait)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mirror.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="mr port">
  <div class="top">
    <div class="kick">Face registration</div>
    <div class="dots"><i class="d"></i><i class="c"></i><i></i><i></i><i></i></div>
  </div>
  <div class="main" style="justify-content: flex-start; padding-top: 48px; gap: 44px">
    <div class="feed first" role="img" aria-label="Live camera feed" style="width: 100%; height: 600px; flex: none">
      <div class="oval" style="width: 280px; height: 380px"></div>
      <span style="position: absolute; font-size: 170px; font-weight: 200; line-height: 1">2</span>
      <span class="m faint" style="position: absolute; bottom: 14px; font-size: 12px">Camera</span>
    </div>
    <div class="col" style="align-items: center; text-align: center">
      <div class="dim" style="font-size: 20px; font-weight: 300">Setting up for Clio</div>
      <h1 class="h" style="font-size: 46px">Turn your head slightly left</h1>
      <div class="m faint" style="font-size: 16px">2 of 5 photos</div>
      <p class="p">Use your phone to capture each photo</p>
    </div>
  </div>
  <div class="foot"><span>Face data stays on this mirror</span><span></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":1280}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
