<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout editor</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}
.cv{position:relative;width:342px;height:192px;background-color:#000;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px);background-size:28.5px 24px;background-position:-.5px -.5px}
.tl{position:absolute;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);box-sizing:border-box;padding:6px 8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:10px;color:rgba(255,255,255,.85);overflow:hidden}
.sel{background:rgba(122,215,255,.12);border:1.5px solid #7ad7ff;color:#fff}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;border:none;background:transparent;color:rgba(255,255,255,.75);font-family:inherit;font-size:11px;cursor:pointer;padding:0}
.act{flex:1;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-family:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
</style>
</helmet>
<div class="s">
  <div class="hdr">
    <a href="E-Discard.dc.html" class="ib" aria-label="Close" style="text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div class="t"><div>Layout</div><div class="cap" style="font-weight: 400">Clio’s layout · Hangar Mirror</div></div>
    <button class="btn sm" style="height: 36px; padding: 0 16px; flex: none" aria-label="Save layout to mirror">Save</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 24px 12px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.75)"><div class="dot"></div>Live on mirror</div>
    <div class="cap wn">Unsaved changes</div>
  </div>

  <div style="padding: 0 24px">
    <div style="border-radius: 10px; border: 1px solid rgba(255,255,255,0.22); padding: 0">
      <div class="cv" aria-label="Mirror canvas, landscape, 8 widgets">
        <div class="tl" style="left: 2px; top: 2px; width: 167px; height: 44px">Clock</div>
        <div class="tl" style="left: 173px; top: 2px; width: 81px; height: 44px">Flight Rules</div>
        <div class="tl" style="left: 258px; top: 2px; width: 82px; height: 44px">Sun &amp; Moon</div>
        <div class="tl sel" style="left: 2px; top: 50px; width: 167px; height: 92px">METAR
          <div style="position: absolute; right: -1px; bottom: -1px; width: 18px; height: 18px; border-top-left-radius: 6px; background: #7ad7ff; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#00141f" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 20h12V8M20 20L10 10"></path></svg></div>
        </div>
        <div class="tl" style="left: 173px; top: 50px; width: 81px; height: 92px">NOTAMs</div>
        <div class="tl" style="left: 258px; top: 50px; width: 82px; height: 92px">TFRs</div>
        <div class="tl" style="left: 2px; top: 146px; width: 167px; height: 44px">TAF</div>
        <div class="tl" style="left: 173px; top: 146px; width: 167px; height: 44px">Winds Aloft</div>
      </div>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 24px 0; position: relative">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7ad7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15a4 4 0 0 0 4 4h9a5 5 0 1 0-.1-10A5 5 0 0 0 6.1 11.1 4 4 0 0 0 3 15z"></path></svg>
      <div style="flex: 1; font-size: 17px">METAR</div>
      <div class="cap">No room for Medium here</div>
    </div>
    <div class="chips">
      <button class="chip">Small <span class="m" style="opacity: 0.7">3×2</span></button>
      <button class="chip" style="opacity: 0.4">Medium <span class="m">4×3</span></button>
      <button class="chip">Wide <span class="m" style="opacity: 0.7">6×2</span></button>
      <button class="chip on" aria-pressed="true">Large <span class="m">6×4</span></button>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="E-Configure.dc.html" class="act" style="text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Configure</a>
      <button class="act"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>Duplicate</button>
      <button class="act" style="color: #ff6b7a; border-color: rgba(255,107,122,0.45)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Remove</button>
    </div>
    <div class="toast" style="bottom: 12px; position: absolute"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7ad7ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Applied Pilot Briefing. Save to keep it.</div>
  </div>

  <div style="display: flex; align-items: center; gap: 4px; border-top: 1px solid rgba(255,255,255,0.14); padding: 8px 12px 30px">
    <a href="E-Library.dc.html" class="tool" style="color: #7ad7ff; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Add widget</a>
    <a href="E-Templates.dc.html" class="tool" style="text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M6 4h12"></path></svg>Templates</a>
    <button class="tool"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>Tidy</button>
    <button class="tool"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>Undo</button>
    <button class="tool" disabled="" style="opacity: 0.35"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg>Redo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
