<div class="s">

    <div class="phdr"><button class="ib" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div class="t">Time zone</div><div style="width: 44px"></div></div>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 0">

        <button class="row"><div class="x"><div>Chicago</div><div class="cap m">America/Chicago</div></div><div class="m v">GMT-5</div></button>
        <button class="row"><div class="x"><div>New York</div><div class="cap m">America/New_York</div></div><div class="m v">GMT-4</div></button>
        <button class="row"><div class="x"><div>London</div><div class="cap m">Europe/London</div></div><div class="m v">GMT+1</div></button>
        <button class="row"><div class="x"><div>Tokyo</div><div class="cap m">Asia/Tokyo</div></div><div class="m v">GMT+9</div></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
