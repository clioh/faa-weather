<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Face registration — capture</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="s">
  <div class="hdr">
    <button class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Back</button>
    <div class="t">Face registration</div>
    <div class="sp"></div>
  </div>
  <div class="body" style="gap: 28px; padding-top: 12px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7ad7ff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg><h1 class="h1">Look at the mirror</h1></div>
      <p class="p">The mirror takes each photo when you hold still. Follow the prompts on the glass.</p>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px">
      <div style="width: 112px; height: 112px; border-radius: 56px; border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#7ad7ff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></div>
      <div style="font-size: 20px">Turn your head slightly left</div>
      <div style="font-size: 15px; color: #7ad7ff">Turn a little further</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px">
      <div style="display: flex; gap: 6px"><div class="dot"></div><div class="dot" style="background: #ffffff"></div><div class="dot" style="background: rgba(255,255,255,0.2)"></div><div class="dot" style="background: rgba(255,255,255,0.2)"></div><div class="dot" style="background: rgba(255,255,255,0.2)"></div></div>
      <div class="cap m">1 of 5 photos</div>
    </div>
  </div>
  <div class="foot">
    <button class="btn btn2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo now</button>
    <button class="link">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</html>
