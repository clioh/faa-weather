<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find your mirror</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="s">
  <div class="hdr">
    <a href="O-Profile.dc.html" class="back" style="text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Back</a>
  </div>
  <div class="body" style="gap: 26px">
    <div class="prog">
      <div class="d"><i></i>Profile</div><div class="c"><i></i>Mirror</div><div><i></i>Setup</div><div><i></i>Template</div><div><i></i>Ready</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 class="h1">Find your mirror</h1>
      <p class="p">We'll search for SkyGlass devices on your network</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center"><div class="lbl">Found mirrors</div><div style="display: flex; align-items: center; gap: 8px" class="cap"><span class="spin" style="width: 12px; height: 12px"></span>Scanning</div></div>
      <div class="rows">
        <a href="O-Pair.dc.html" class="row">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect></svg>
          <div class="x"><div>SkyGlass Hangar</div><div class="cap m">192.168.1.42:3000 · v1.4.2</div></div>
          <span class="badge">NEW</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
        <button class="row">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect></svg>
          <div class="x"><div>Hallway</div><div class="cap m">192.168.1.57:3001 · v1.4.2</div></div>
          <span class="spin"></span>
        </button>
      </div>
    </div>
    <div class="note ne" style="align-items: center">
      <div style="flex: 1">Connection timed out. The mirror may be busy or unreachable.</div>
      <button class="ib" aria-label="Retry" style="width: 32px; height: 32px; color: inherit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg></button>
      <button class="ib" aria-label="Dismiss" style="width: 32px; height: 32px; color: inherit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <button class="row" style="border-bottom: 1px solid rgba(255,255,255,0.14)">
      <div class="x">Enter IP manually</div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
  <div class="foot">
    <button class="btn btn2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>Scan again</button>
    <button class="link">Set up later</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
