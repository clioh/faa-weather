<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mirror — provisioning (landscape)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mirror.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="mr land">
  <div class="top">
    <div class="brand"><svg width="18" height="26" viewBox="0 0 64 92" aria-hidden="true"><rect x="2" y="2" width="60" height="88" rx="9" fill="#fff"></rect><path d="M2 45L62 11V23L2 57Z" fill="#7ad7ff"></path><path d="M2 61L62 27V30L2 64Z" fill="#7ad7ff"></path></svg>SKYGLASS</div>
    <div class="m faint" style="font-size: 13px">Not connected</div>
  </div>
  <div class="main" style="gap: 64px">
    <div class="col">
      <div class="kick">SkyGlass setup</div>
      <h1 class="h">Let’s get your mirror online.</h1>
      <p class="p">Once the mirror is online, finish setup in the SkyGlass app on your phone.</p>
    </div>
    <div class="panel first" style="flex-direction: row; align-items: flex-start; gap: 40px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <div class="m ac" style="font-size: 14px">01 · Connect to Wi-Fi</div>
        <div class="qr qr2" role="img" aria-label="QR code to join SkyGlass-Setup"><i style="left: 14px; top: 14px"></i><i style="right: 14px; top: 14px"></i><i style="left: 14px; bottom: 14px"></i><b></b></div>
        <div class="m" style="font-size: 22px">SkyGlass-Setup</div>
        <div class="faint" style="font-size: 15px">Scan with phone camera</div>
      </div>
      <div class="m faint" style="font-size: 14px; padding-top: 120px">then</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <div class="m ac" style="font-size: 14px">02 · Open setup page</div>
        <div class="qr qr2" role="img" aria-label="QR code for the setup page"><i style="left: 14px; top: 14px"></i><i style="right: 14px; top: 14px"></i><i style="left: 14px; bottom: 14px"></i><b></b></div>
        <div class="m" style="font-size: 22px">10.42.0.1</div>
        <div class="faint" style="font-size: 15px">Scan or type in browser</div>
      </div>
    </div>
  </div>
  <div class="foot"><span>Open network · no password</span><span>v1.4.2</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
