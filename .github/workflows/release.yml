# SkyGlass Release Pipeline
#
# Triggered on version tags (v*.*.*):
# - Builds the device release tarball (skyglass-vX.Y.Z.tar.gz)
# - Creates GitHub release with the tarball attached
# - Generates release notes

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A release built with the placeholder public key can never verify an
      # activation token, so every licensed mirror would be locked out.
      # Replace LICENSE_PUBLIC_KEY_PEM and set the flag to false first
      # (docs/LICENSING.md "Activation token").
      - name: Check license public key is not the placeholder
        run: |
          set -euo pipefail
          FILE=packages/backend/src/license/public-key.ts
          if ! grep -Eq '^export const LICENSE_PUBLIC_KEY_IS_PLACEHOLDER = false;' "$FILE"; then
            echo "::error file=$FILE::LICENSE_PUBLIC_KEY_IS_PLACEHOLDER is not false. Embed the real public key (node scripts/license-keygen.mjs) before releasing."
            exit 1
          fi

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Write to file for multiline output
          cat << EOF > release_notes.md
          ## What's Changed

          $COMMITS

          ## Installation

          ### Raspberry Pi (new install)
          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git SkyGlass
          cd SkyGlass
          git checkout v${{ steps.version.outputs.version }}
          ./scripts/setup-pi.sh
          \`\`\`

          ### Existing mirrors
          Install from the display (*Download*, then *Install Now*) or run
          \`./scripts/update.sh --apply\`; both use the tarball attached below.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.version.outputs.version }}
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only the packages that run on the mirror are built; cloud-api,
      # website and mobile are deployed separately.
      - name: Build device packages
        run: npx turbo build --filter=@skyglass/backend --filter=@skyglass/frontend

      # Release asset consumed by:
      #   - packages/backend/src/services/updater.ts (first *.tar.gz asset of releases/latest)
      #   - scripts/update.sh --check/--apply (first *.tar.gz asset of releases/latest)
      #   - scripts/flash-sd.sh (latest: first *.tar.gz asset;
      #     SKYGLASS_VERSION=vX.Y.Z: releases/download/vX.Y.Z/skyglass-vX.Y.Z.tar.gz)
      # It must be the only *.tar.gz asset, and has no top-level folder
      # (flash-sd.sh extracts it straight into ~/SkyGlass).
      - name: Build release tarball
        id: tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="skyglass-v${VERSION}.tar.gz"
          test -f packages/backend/dist/server.js
          test -f packages/frontend/dist/index.html
          echo "$VERSION" > VERSION
          tar -czf "$RUNNER_TEMP/$ASSET" \
            --exclude=node_modules \
            --exclude=venv \
            --exclude=.venv \
            --exclude=face_data \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            --exclude=.expo \
            --exclude=.turbo \
            --exclude='*.tsbuildinfo' \
            --exclude='*snapshot_*.jpg' \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=packages/mobile \
            --exclude=packages/website \
            --exclude=packages/cloud-api \
            --exclude=packages/data \
            --exclude=config/config.yaml \
            package.json package-lock.json turbo.json VERSION LICENSE \
            packages scripts config docs
          # Fail fast if the archive is missing what update.sh/setup-pi.sh need
          tar -tzf "$RUNNER_TEMP/$ASSET" > "$RUNNER_TEMP/contents.txt"
          for f in package.json VERSION config/pm2.config.cjs scripts/update.sh scripts/setup-pi.sh \
                   packages/backend/dist/server.js packages/frontend/dist/index.html \
                   packages/presence/requirements.txt \
                   packages/presence/models/face_detection_yunet_2023mar.onnx; do
            grep -qxE "(\./)?$f" "$RUNNER_TEMP/contents.txt" || { echo "missing $f in $ASSET"; exit 1; }
          done
          if grep -qE '(^|/)(node_modules|venv|face_data)/|^(\./)?packages/(mobile|website)/|^(\./)?config/config\.yaml' "$RUNNER_TEMP/contents.txt"; then
            echo "runtime state or unneeded packages leaked into $ASSET"; exit 1
          fi
          (cd "$RUNNER_TEMP" && sha256sum "$ASSET" > "$ASSET.sha256")
          echo "asset=$RUNNER_TEMP/$ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$ASSET.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$ASSET"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: SkyGlass v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            ${{ steps.tarball.outputs.asset }}
            ${{ steps.tarball.outputs.checksum }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
