# SkyGlass CI Pipeline
#
# Runs on every push and pull request:
# - Linting and type checking
# - Unit tests
# - Build verification
# - Docker build test

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint and Type Check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check backend
        run: npx tsc --noEmit -p packages/backend

      - name: Type check frontend
        run: npx tsc --noEmit -p packages/frontend

  # ============================================================
  # Backend Tests
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --workspace=packages/backend
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: packages/backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ============================================================
  # Frontend Tests
  # ============================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # packages/frontend has no test script yet; --if-present keeps this
      # job green until one is added
      - name: Run frontend tests
        run: npm test --workspace=packages/frontend --if-present
        env:
          NODE_ENV: test

  # ============================================================
  # Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/backend/dist
            packages/frontend/dist
          retention-days: 7

  # ============================================================
  # Docker Build Test
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: skyglass:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Python Presence Detection
  # ============================================================
  test-presence:
    name: Presence Detection (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packages/presence/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev python3-opencv

      - name: Install Python dependencies
        run: |
          cd packages/presence
          pip install -r requirements.txt

      - name: Lint Python code
        run: |
          pip install flake8
          cd packages/presence
          flake8 --max-line-length=120 --ignore=E501,W503 *.py

      - name: Check Python imports
        run: |
          cd packages/presence
          python3 -c "import detector; import web_server; import admin_portal"
