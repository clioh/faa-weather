# SkyGlass Default Configuration
# Copy this to config.yaml and customize for your setup

# Primary airport ICAO code for METAR/TAF
airport: KJFK

# SkyGlass cloud service: calendar sign-in (Google/Outlook), NOTAMs and stock
# quotes. It holds every third-party API key and OAuth secret, so the mirror
# needs none. Self-hosters: point at your own deployment (docs/CLOUD_SERVICE.md).
# Must be https (http only for localhost/127.0.0.1).
skyglass_service: https://skyglass.dev

# Your location (for sun/moon calculations)
location:
  latitude: 40.6413
  longitude: -73.7781
  timezone: America/New_York

# Display settings
display:
  presence_timeout: 120        # Seconds before display sleeps after you leave
  fade_duration: 1000          # Fade animation in milliseconds
  brightness: 80               # Default brightness percentage
  orientation: landscape       # landscape | portrait (mirror panel mounted vertically)

# Calendars are connected from the phone app (Settings > Calendars) and stored
# in data/calendar-accounts.json. The mirror needs no OAuth app credentials.
# Setup details: docs/CALENDAR.md
calendar:
  refresh_minutes: 10                      # Background sync interval

# Flight schedule from email
schedule:
  email:
    enabled: false
    imap_host: imap.gmail.com
    imap_port: 993
    username: ${EMAIL_USER}
    password: ${EMAIL_PASS}
    folder: INBOX
    poll_interval: 300         # Seconds between email checks
    sender_filter: ""          # Filter emails by sender address

# Stock quotes come from skyglass_service; when it is unreachable the mirror
# falls back to the keyless Yahoo chart endpoint. NOTAMs come from
# skyglass_service too (no key needed on the mirror).

# Presence detection settings
# Read by packages/presence/detector.py at startup (restart skyglass-detector
# after editing); its CLI flags override these values.
presence:
  camera_index: 0              # Camera device index (0 = default)
  # face_recognition = dlib face encodings, recognizes enrolled users (most accurate, heaviest)
  # opencv           = OpenCV's bundled YuNet face detector, detects any face (lightest, no extra install)
  # auto             = face_recognition if installed, else opencv
  detection_method: auto       # face_recognition | opencv | auto
  tolerance: 0.6               # Face match tolerance, 0-1 (lower = stricter; face_recognition only)
  min_detection_frames: 3      # Consecutive detections needed to confirm presence
  timeout: 5                   # Seconds without a face before marking absent

# Licensing (docs/LICENSING.md). The key is entered from the phone app or
# picked up from /boot/firmware/skyglass-license.txt on pre-flashed kits.
# SKYGLASS_LICENSE=off disables licensing (the npm run dev* scripts set it).
license:
  enabled: true
  server: https://skyglass.dev     # Cloud license API (POST /api/license/activate|refresh)
