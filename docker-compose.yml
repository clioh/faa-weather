# SkyGlass Docker Compose Configuration
#
# Usage:
#   docker compose up -d        # Start all services
#   docker compose logs -f      # View logs
#   docker compose down         # Stop all services
#
# For development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#

services:
  # Backend API Server + display UI (serves packages/frontend/dist on 3001)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SKYGLASS_SERVE_FRONTEND=1
    volumes:
      - ./config:/app/config:ro
      - mirror-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Presence Detection (Python)
  # Only works with camera access - comment out if not using
  presence:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: presence
    ports:
      - "5000:5000"
    environment:
      - PRESENCE_PORT=5000
      - CAMERA_INDEX=0
    volumes:
      - ./config:/app/config:ro
      - face-data:/app/packages/presence/face_data
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped
    # Uncomment for Raspberry Pi camera:
    # privileged: true

volumes:
  mirror-data:
    driver: local
  face-data:
    driver: local
